# 公共构建参数（入库，不含任何密钥或私有地址）
#
# 私有项（正式签名 / UPDATE_JSON_URL）请用环境变量 ORG_GRADLE_PROJECT_<名称>、
# 命令行 -P<名称>=<值>，或用户级 ~/.gradle/gradle.properties 提供，切勿写进本文件。
# 详见同目录 LOCAL-CONFIG.md。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
